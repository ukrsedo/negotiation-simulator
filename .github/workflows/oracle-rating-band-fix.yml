name: Oracle rating band scoring
on:
  push:
    paths:
      - '.github/workflows/oracle-rating-band-fix.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Oracle rating bands
        run: python3 scripts/oracle_rating_band_fix.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check scenarios.js
          grep -q "Excellent:1,Strong:.8,Moderate:.5,Weak:.2,Poor:0" app.js
          grep -q "oracleConcessionRating" app.js
          grep -q "oracleRound3Rating" app.js
          grep -q "20260905-oracle64" index.html
      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'Align Oracle score with rating bands'
          git push
