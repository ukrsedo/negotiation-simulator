name: Oracle Round 4 exchange redesign

on:
  push:
    paths:
      - '.github/workflows/oracle-round4-exchange.yml'

permissions:
  contents: write

jobs:
  update-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Oracle update
        run: python3 scripts/oracle_round4_update.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check scenarios.js
          grep -q 'Oracle is prepared to offer' app.js
          grep -q '20260905-oracle61' index.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js scenarios.js index.html
          git commit -m 'Mirror two-sided concession exchange for Oracle'
          git push
