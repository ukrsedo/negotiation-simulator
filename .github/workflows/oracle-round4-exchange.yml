name: Oracle Round 4 exchange redesign

on:
  push:
    paths:
      - '.github/workflows/oracle-round4-exchange.yml'

permissions:
  contents: write

jobs:
  update-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Oracle negotiation game
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app=Path('app.js')
          s=app.read_text()

          old="if(st.key==='SAP_Transformation'&&st.round===4){sapConcessionRound();return}"
          new="if(st.round===4){if(st.key==='SAP_Transformation')return sapConcessionRound();if(st.key==='Oracle_Audit')return oracleConcessionRound()}"
          if old not in s: raise SystemExit('playRound SAP round4 target not found')
          s=s.replace(old,new,1)

          anchor='function concessionPairValue(action){'
          oracle_fn=r'''function oracleConcessionRound(){
  const r=st.g.rounds.round_4;
  if(!st.oracleSupplierOffer){
    const prefs=st.g.round4_supplier_preferences?.[st.profile]||[],offer=prefs[0]||Object.keys(st.g.round4_supplier_offers||{})[0];
    if(!offer){set('<p class="notice error">No Oracle concession offer is configured.</p>');return}
    st.oracleSupplierOffer=offer;
    st.supplierDecisions.push({round:4,action:offer,preferenceKey:'round4_supplier_offer',rank:1,validActions:[...prefs],effects:[]});
    st.history.push({round:4,actor:'Supplier',action:offer});
  }
  const offer=st.oracleSupplierOffer,offerText=st.g.round4_supplier_offers?.[offer]||label(offer);
  set(`<div class="round-head"><div><p class="section-kicker">${st.g.game.name}</p><h2>Round 4 of 6 · Concession exchange</h2></div></div>${roundProgress(4)}
    <div class="supplier-response"><span class="response-label">Oracle is prepared to offer</span><h3>${label(offer)}</h3><p>${offerText}</p></div>
    <section class="action-section"><h3>What are you prepared to trade in return?</h3><p>Choose the reciprocal customer concession. The value of the exchange depends on both sides of the trade.</p><div id="available" class="action-grid"></div></section>`);
  const av=document.getElementById('available'),available=Object.keys(r.actions).filter(a=>validity(a).ok);
  available.forEach(a=>{const b=document.createElement('button');b.className='action-card';b.innerHTML=`<strong>${label(a)}</strong><span>${r.actions[a]}</span><em>Select →</em>`;b.onclick=()=>customerAction(a);av.appendChild(b)});
}
function currentConcessionOffer(){return st.key==='SAP_Transformation'?st.sapSupplierOffer:st.key==='Oracle_Audit'?st.oracleSupplierOffer:null}
'''
          if anchor not in s: raise SystemExit('concessionPairValue anchor not found')
          s=s.replace(anchor,oracle_fn+anchor,1)

          s=re.sub(r"function concessionPairValue\(action\)\{.*?\n\}","function concessionPairValue(action){\n  const offer=currentConcessionOffer();\n  if(!offer)return Number(st.g.concession_modifiers?.[st.profile]?.[action]??0);\n  return Number(st.g.concession_pair_modifiers?.[st.profile]?.[offer]?.[action]??0);\n}",s,count=1,flags=re.S)

          old="consequence=st.key==='SAP_Transformation'?`SAP offered ${label(st.sapSupplierOffer)}; you offered ${label(d.action)} in return.`:`You offered ${label(d.action)} as the value exchange before the supplier's next response.`;"
          new="consequence=currentConcessionOffer()?`${st.key==='SAP_Transformation'?'SAP':'Oracle'} offered ${label(currentConcessionOffer())}; you offered ${label(d.action)} in return.`:`You offered ${label(d.action)} as the value exchange before the supplier's next response.`;"
          if old not in s: raise SystemExit('round4 consequence target not found')
          s=s.replace(old,new,1)

          pattern=r"function renderBestAnswers\(\)\{.*?\n\}\nfunction renderConceptApplications"
          replacement=r'''function renderBestAnswers(){
  const rows=[];
  const add=(round,chosen,best,reason)=>rows.push(`<div class="analysis-card"><strong>Round ${round}</strong><p><b>Your choice:</b> ${chosen}</p><p><b>Best available answer:</b> ${best}</p><p>${reason}</p></div>`);
  const d1=st.decisions.find(d=>d.round===1);
  if(d1)add(1,label(d1.action),label('negotiate'),st.key==='SAP_Transformation'?'Keeps options open and tests SAP’s willingness to trade without making a premature transformation commitment.':'Keeps commercial resolution open without immediately accepting liability or escalating the dispute.');
  const d3=st.decisions.find(d=>d.round===3);
  if(d3){
    const scoreR3=a=>{if(st.key==='Oracle_Audit'&&a==='negotiate_concession'){const prefs=st.g.preferences?.[st.profile]?.round_5_after_negotiate_concession||[];const supplier=prefs.find(x=>st.g.outcome_resolution?.negotiate_concession?.[x]);const out=st.g.outcome_resolution?.negotiate_concession?.[supplier];return out?outcomeScore(out):-999}return outcomeScore(a)};
    const candidates=d3.available.filter(a=>a!=='rejection_of_notice'||validity(a).ok),best=[...candidates].sort((a,b)=>scoreR3(b)-scoreR3(a))[0];
    if(best)add(3,label(d3.action),label(best),actionAnalysis(best,'customer')?.advice||'This was the strongest available customer direction at this stage.');
  }
  const d4=st.decisions.find(d=>d.round===4);
  if(d4){const offer=currentConcessionOffer(),best=[...d4.available].sort((a,b)=>concessionPairValue(b)-concessionPairValue(a))[0];if(best)add(4,`${label(offer)} ↔ ${label(d4.action)}`,`${label(offer)} ↔ ${label(best)}`,`This pairing gives the strongest value balance against the supplier’s ${label(offer)} offer under the selected supplier profile.`);}
  const d6=st.decisions.find(d=>d.round===6);
  if(d6){
    const preserved=resolveCurrentOutcome(),fallback=st.key==='SAP_Transformation'?'continue_delay':'dispute',candidates=[];
    if(preserved)candidates.push({answer:'Commit',outcome:preserved});
    if(d6.available.includes('withdraw'))candidates.push({answer:'Withdraw',outcome:fallback});
    if(d6.available.includes('change_direction'))availableActionsForReplacement().forEach(o=>candidates.push({answer:`Change Direction → ${label(o)}`,outcome:o}));
    const best=[...candidates].sort((a,b)=>outcomeScore(b.outcome)-outcomeScore(a.outcome))[0],chosen=d6.replacement?`${label(d6.action)} → ${label(d6.replacement)}`:label(d6.action);
    if(best)add(6,chosen,best.answer,'Produces the strongest available customer outcome at the final decision point.');
  }
  return rows.join('')||'<p>No customer decisions were recorded.</p>';
}
function renderConceptApplications'''
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('renderBestAnswers block not found')
          s=s2

          old="const learningReview=st.key==='SAP_Transformation'?`<details><summary>Best answer by round</summary><div class=\"detail-body\">${renderBestAnswers()}</div></details>`:`<details><summary>Opportunity cost</summary><div class=\"detail-body\">${renderOpportunityCost()}</div></details>`;"
          new="const learningReview=`<details><summary>Best answer by round</summary><div class=\"detail-body\">${renderBestAnswers()}</div></details>`;"
          if old not in s: raise SystemExit('learningReview target not found')
          s=s.replace(old,new,1)
          app.write_text(s)

          sc=Path('scenarios.js')
          t=sc.read_text()
          marker='  "Oracle_Audit": {'
          if marker not in t: raise SystemExit('Oracle marker not found')
          before,oracle=t.split(marker,1)
          oracle=oracle.replace('"name": "Oracle Audit",\n      "version": "6.0"','"name": "Oracle Audit",\n      "version": "6.1"',1)

          path_anchor='    "path_rules": {'
          offer_block='''    "round4_supplier_offers": {
      "liability_reduction": "Reduce the asserted audit liability in exchange for a commercially acceptable resolution.",
      "audit_closure": "Provide explicit audit closure and release language once agreed obligations are completed.",
      "price_protection": "Offer future price protection and clearer licence rights as part of a negotiated resolution.",
      "governance_support": "Provide licence-governance support and clearer compliance guidance without requiring immediate product expansion.",
      "no_additional_concession": "Oracle maintains its current commercial position and offers no additional value at this stage."
    },
    "round4_supplier_preferences": {
      "revenue_recovery": ["liability_reduction", "audit_closure", "price_protection", "governance_support", "no_additional_concession"],
      "expansion": ["price_protection", "liability_reduction", "audit_closure", "governance_support", "no_additional_concession"],
      "account_protection": ["governance_support", "audit_closure", "liability_reduction", "price_protection", "no_additional_concession"],
      "dependency_growth": ["price_protection", "liability_reduction", "audit_closure", "governance_support", "no_additional_concession"],
      "maximum_pressure": ["no_additional_concession", "liability_reduction", "audit_closure", "price_protection", "governance_support"]
    },
'''
          if path_anchor not in oracle: raise SystemExit('Oracle path_rules anchor not found')
          oracle=oracle.replace(path_anchor,offer_block+path_anchor,1)

          start=oracle.index('    "concession_modifiers": {')
          end=oracle.index('    "customer_economic_scores": {',start)
          pair_block='''    "concession_pair_modifiers": {
      "revenue_recovery": {
        "liability_reduction": {"future_subscription": 2, "cloud_commitment": 0, "longer_term": 1, "governance_commitment": 4, "hold_position": -2}
      },
      "expansion": {
        "price_protection": {"future_subscription": 1, "cloud_commitment": -2, "longer_term": 2, "governance_commitment": 0, "hold_position": -3}
      },
      "account_protection": {
        "governance_support": {"future_subscription": 1, "cloud_commitment": -1, "longer_term": 1, "governance_commitment": 5, "hold_position": -2}
      },
      "dependency_growth": {
        "price_protection": {"future_subscription": -4, "cloud_commitment": -6, "longer_term": -3, "governance_commitment": 3, "hold_position": 1}
      },
      "maximum_pressure": {
        "no_additional_concession": {"future_subscription": -6, "cloud_commitment": -7, "longer_term": -5, "governance_commitment": -2, "hold_position": 3}
      }
    },
'''
          oracle=oracle[:start]+pair_block+oracle[end:]

          supplier_anchor='        "settlement_offer": {"signal": "Oracle is seeking a direct commercial recovery and closure."'
          supplier_entries='''        "liability_reduction": {"signal": "Oracle is prepared to reduce asserted liability to secure a commercial resolution.", "objective": "Recover value while improving the probability of settlement.", "response": "Compare the reduction with the value and lock-in of anything requested in return."},
        "audit_closure": {"signal": "Oracle is prepared to exchange formal closure certainty for agreed customer obligations.", "objective": "Close the audit while preserving enforceable commercial value.", "response": "Require explicit release language and define exactly what closes the audit."},
        "price_protection": {"signal": "Oracle is willing to improve future commercial certainty to encourage agreement.", "objective": "Secure future business while reducing resistance to commitment.", "response": "Value the protection against the cost and dependency of the reciprocal commitment."},
        "governance_support": {"signal": "Oracle is willing to support future compliance and licence governance.", "objective": "Protect the account and reduce repeat audit friction.", "response": "Define deliverables and avoid exchanging excessive future business for governance support."},
        "no_additional_concession": {"signal": "Oracle believes its current audit position is strong enough to avoid further movement.", "objective": "Preserve enforcement and commercial leverage.", "response": "Do not offer an expensive reciprocal concession without measurable value in return."},
'''
          if supplier_anchor not in oracle: raise SystemExit('Oracle supplier analysis anchor not found')
          oracle=oracle.replace(supplier_anchor,supplier_entries+supplier_anchor,1)
          sc.write_text(before+marker+oracle)

          idx=Path('index.html')
          h=idx.read_text()
          h=h.replace('scenarios.js?v=20260905-sap61','scenarios.js?v=20260905-oracle61').replace('app.js?v=20260905-sap61','app.js?v=20260905-oracle61')
          idx.write_text(h)
          PY

          node --check app.js
          node --check scenarios.js
          grep -q 'Oracle is prepared to offer' app.js
          grep -q '"version": "6.1"' scenarios.js
          grep -q '20260905-oracle61' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js scenarios.js index.html
          git commit -m 'Mirror two-sided concession exchange for Oracle'
          git push
