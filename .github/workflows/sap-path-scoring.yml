name: SAP path scoring
on:
  push:
    paths:
      - '.github/workflows/sap-path-scoring.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/sap_path_scoring.py
      - run: |
          node --check app.js
          node --check scenarios.js
          grep -q 'sapDecisionScore' app.js
          grep -q '20260905-sap62' index.html
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add app.js index.html
          git commit -m 'Score SAP negotiation by decision path'
          git push
