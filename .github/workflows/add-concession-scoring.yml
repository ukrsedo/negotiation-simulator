name: Add concession scoring

on:
  push:
    paths:
      - '.github/workflows/add-concession-scoring.yml'

permissions:
  contents: write

jobs:
  update-scoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and validate scoring
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          node --check app.js
          node --check scenarios.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js scenarios.js
          git commit -m 'Make concession exchange affect negotiation scoring'
          git push