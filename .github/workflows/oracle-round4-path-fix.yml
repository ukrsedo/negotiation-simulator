name: Oracle Round 4 path fix

on:
  push:
    paths:
      - '.github/workflows/oracle-round4-path-fix.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Oracle Round 4 path logic
        run: python3 scripts/oracle_round4_path_fix.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check scenarios.js
          grep -q 'round4_supplier_preferences_by_path' scenarios.js
          grep -q 'Oracle has offered no additional value' app.js
          grep -q '20260905-oracle62' index.html
      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js scenarios.js index.html
          git commit -m 'Make Oracle Round 4 path-sensitive'
          git push
