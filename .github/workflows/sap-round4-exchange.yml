name: SAP Round 4 exchange redesign

on:
  push:
    paths:
      - '.github/workflows/sap-round4-exchange.yml'

permissions:
  contents: write

jobs:
  update-sap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update SAP game
        run: python3 scripts/sap_round4_update.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check scenarios.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js scenarios.js
          git commit -m 'Redesign SAP Round 4 as two-sided concession exchange'
          git push
