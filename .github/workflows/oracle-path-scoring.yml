name: Oracle path scoring

on:
  push:
    paths:
      - '.github/workflows/oracle-path-scoring.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Oracle scoring update
        run: python3 scripts/oracle_path_scoring.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check scenarios.js
          grep -q 'oracleDecisionScore' app.js
          grep -q 'Decision-path assessment across Rounds 1, 3, 4 and 6 plus final outcome' app.js
          grep -q '20260905-oracle63' index.html
      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'Score Oracle negotiation by decision path'
          git push
